name: Expo Preview Check

on:
  push:
    branches: [codex/independent-app-build]
  workflow_dispatch:

concurrency:
  group: expo-preview-check
  cancel-in-progress: true

jobs:
  preview-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec expo config --type public
      - run: pnpm exec expo export --platform ios --output-dir dist-ios
